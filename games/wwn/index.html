<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07050f">
  <title>第n次世界大戦 · ロビー · G_GAMES</title>
  <link rel="stylesheet" href="css/lobby.css">
  <script src="js/net/peer-manager.js" defer></script>
  <script src="js/net/room.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <div class="lobby-wrap">
    <header class="lobby-header">
      <a href="../../index.html" class="back">← G_GAMES ホーム</a>
      <h1>第n次世界大戦</h1>
      <p>見下ろし型2D空中戦 · ロビー</p>
    </header>

    <div class="open-banner">
      <h3>オープン乱戦ワールド</h3>
      <p>公式常設ルームへワンクリック参加。途中参加・リスポーン対応。</p>
      <button type="button" class="btn btn-primary" id="btn-open" style="width:100%;">オープンワールドに参加</button>
    </div>

    <div class="panel" id="form-panel">
      <div class="panel-title">ルーム設定</div>

      <div class="field">
        <label for="username">ユーザー名（必須）</label>
        <input type="text" id="username" placeholder="例: AcePilot" maxlength="24" autocomplete="username">
        <p class="hint">半角英数字・ハイフン・アンダースコア（2〜24文字）</p>
      </div>

      <div class="field">
        <label for="room-name">ルーム名（必須）</label>
        <input type="text" id="room-name" placeholder="例: SkyBattle01" maxlength="24" autocomplete="off">
        <p class="hint">同じルーム名＋キーのプレイヤー同士がマッチングされます</p>
      </div>

      <div class="field">
        <label for="room-key">ルームキー（任意・パスワード）</label>
        <input type="password" id="room-key" placeholder="未入力でもOK" maxlength="32" autocomplete="off">
      </div>

      <div class="field">
        <label>対戦形式</label>
        <div class="mode-grid">
          <button type="button" class="mode-btn active" data-mode="1v1">1 vs 1</button>
          <button type="button" class="mode-btn" data-mode="team">チーム戦</button>
          <button type="button" class="mode-btn" data-mode="br">バトルロイヤル</button>
          <button type="button" class="mode-btn" data-mode="open">オープン</button>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-primary" id="btn-join">ルームを作成 / 参加</button>
      </div>
    </div>

    <div class="panel hidden" id="connected-panel">
      <div class="panel-title">接続中</div>

      <div class="status-bar" id="status-bar">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">未接続</span>
      </div>

      <div class="owner-badge hidden" id="owner-badge">
        ルームオーナー：<strong id="owner-name">—</strong>
      </div>

      <div class="hidden" id="team-panel" style="margin-bottom:1rem;">
        <div class="panel-title" style="margin-bottom:0.6rem;">チーム選択</div>
        <div class="mode-grid">
          <button type="button" class="mode-btn team-red-btn" data-team="RED">RED</button>
          <button type="button" class="mode-btn team-blue-btn" data-team="BLUE">BLUE</button>
        </div>
        <p class="hint" style="margin-top:0.5rem;">チーム戦時のみ有効。自動振り分け後も変更可能です。</p>
      </div>

      <div class="panel-title" style="margin-top:0.5rem;">プレイヤー</div>
      <ul class="player-list" id="player-list"></ul>

      <div class="actions">
        <button type="button" class="btn btn-ghost" id="btn-leave">退出する</button>
        <p style="font-size:0.8rem;color:var(--text-muted);text-align:center;margin-top:0.5rem;">
          Step3: ホストマイグレーション・フルメッシュ・チーム選択対応済み。<br>
          ゲーム本編は次のステップで実装します。
        </p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
</body>
</html>
